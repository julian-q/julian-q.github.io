<!doctype html>
<html>
<head>
<title>voxel explorer</title>
<meta name=description content="📬 julian's stuff">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/julian.css">
<link rel="icon" href="/img/julian.ico">
<style>
#p5 canvas {
    display: block;
    height: 100% !important;
    inset: 0;
    position: absolute;
    width: 100% !important;
    z-index: 1;
}
#voxel-hud {
    inset: 0;
    pointer-events: none;
    position: absolute;
    z-index: 2;
}
#voxel-crosshair {
    height: 18px;
    left: 50%;
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 18px;
}
#voxel-crosshair::before,
#voxel-crosshair::after {
    background: rgba(255, 255, 255, 0.75);
    content: "";
    left: 50%;
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
}
#voxel-crosshair::before {
    height: 1px;
    width: 18px;
}
#voxel-crosshair::after {
    height: 18px;
    width: 1px;
}
#voxel-shards {
    display: flex;
    gap: 5px;
    left: 14px;
    position: absolute;
    top: 14px;
}
#voxel-shards span {
    background: rgba(31, 53, 69, 0.8);
    display: block;
    height: 8px;
    width: 8px;
}
#voxel-shards span.found {
    background: #3de8cc;
    box-shadow: 0 0 8px rgba(61, 232, 204, 0.7);
}
</style>
<script src="/sketches/p5.min.js"></script>
<script src="sketch.js"></script>

</head>
<body>
    <div class="flex_container">
        <div class="menu_bar">
            <a href="/" id="me"><img src="/img/graphy.webp" style="height: 100px;"></a>
        </div>
        <div class="center_bar" id="titlebar">
            <div class="title">voxel explorer</div>
        </div>
        <div class="menu_bar" id="topright"></div>
    </div>
    <div class="flex_container">
        <div class="menu_bar" id="menu">
            <ul>
                <a href="/"><li>about</li></a>
                <a href="/contact"><li>contact</li></a>
                <a href="/updates/"><li>updates</li></a>
                <a href="/sketches/"><li>sketches</li></a>
                <a href="/photos/"><li>photos</li></a>
            </ul>
        </div>
        <div class="center_bar" id="main">
<div id="p5" class="fullwidthbox">
    <div id="voxel-hud" aria-hidden="true">
        <div id="voxel-shards"></div>
        <div id="voxel-crosshair"></div>
    </div>
</div>
<p>Drag to look. WASD or arrow keys to walk. Collect the glowing voxels.</p>
<p><a href="sketch.js">source</a></p>

        </div>
        <div class="menu_bar" id="rightspace"></div>
    </div>
</body>
</html>
